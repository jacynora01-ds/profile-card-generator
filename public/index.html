<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile Studio | Profile Card Generator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Heading -->
        <div class="heading">
            <h1>Profile Studio</h1>
            <p>Create your professional digital identity.</p>
        </div>

        <!-- Profile Form -->
        <form
            action="/create-profile"
            method="POST"
            enctype="multipart/form-data"
            id="profileForm"
        >

            <h2>Create Your Profile</h2>

            <!-- Full Name -->
            <label>Full Name *</label>
            <input
                type="text"
                name="name"
                id="name"
                placeholder="Enter your full name"
                maxlength="60"
                required
            >

            <!-- Profile Picture -->
            <label>Profile Picture</label>
            <input
                type="file"
                name="profileImage"
                id="profileImage"
                accept="image/*"
            >

            <small>Upload your photo or use the automatic avatar.</small>

            <!-- Bio -->
            <label>About Me *</label>
            <textarea
                name="bio"
                id="bio"
                placeholder="Write something about yourself..."
                maxlength="500"
                required
            ></textarea>

            <small id="charCount">0 / 500 characters</small>

            <!-- Skills -->
            <label>Skills *</label>
            <input
                type="text"
                name="skills"
                id="skills"
                placeholder="Python, Java, HTML, CSS"
                maxlength="300"
                required
            >

            <!-- Social Links -->
            <label>LinkedIn Profile</label>
            <input
                type="url"
                name="linkedin"
                id="linkedin"
                placeholder="https://linkedin.com/in/username"
            >

            <label>GitHub Profile</label>
            <input
                type="url"
                name="github"
                id="github"
                placeholder="https://github.com/username"
            >

            <label>Instagram Profile</label>
            <input
                type="url"
                name="instagram"
                id="instagram"
                placeholder="https://instagram.com/username"
            >

            <!-- Submit -->
            <button type="submit">
                Generate My Profile →
            </button>

        </form>

        <!-- Live Preview -->
        <div class="preview">

            <h2>Live Preview</h2>

            <div class="preview-card">

                <!-- Automatic Avatar -->
                <div class="avatar" id="previewAvatar">
                    ?
                </div>

                <!-- Uploaded Image -->
                <img
                    id="previewImage"
                    src=""
                    alt="Profile Preview"
                    style="display: none;"
                >

                <h3 id="previewName">Your Name</h3>

                <p id="previewBio">
                    Your bio will appear here.
                </p>

                <div id="previewSkills">
                    <span>Your skills</span>
                </div>

            </div>

        </div>

        <!-- Footer -->
        <p class="footer">
            Designed with Profile Studio
        </p>

    </div>

    <script src="script.js"></script>

</body>

</html>
